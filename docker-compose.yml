version: "3.9"

services:
  apex-proxy:
    build: .
    container_name: apex-gemini-proxy
    ports:
      - "8787:8787"
    environment:
      # Mount your .env file OR override these directly:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - AI_PROVIDER=gemini
      - PORT=8787
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource limits — adjust based on expected load
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  default:
    name: apex-network
